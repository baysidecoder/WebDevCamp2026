<html>
    <head>
        <title>Character Creator</title>
        <link rel="stylesheet" href="style.css">
    </head>
        <body>
            <div class="creatorCard">
                <h1>Character Creator</h1>
                <p class="intro">Build</p>
           <form>
               <label for="name">Character Name</label>
               <input id="name" type="text" placeholder="Example: Bob" required>
               <label for="class">Character class</label>
               <select id="class" required>
                   <option value="" disabled selected>Chose a class</option>
                   <option value="wizard">Wizard</option>
                    <option value="fighter">fighter</option>
                    <option value="healer">healer</option>
               </select>
                <label for ="favorite-color">Farorite Colour</label>
                <input id="color" type="color" value="white">
                
                <label for="startingItem"> Starting item </label>
                <select id= "item" >
                    <option value="" disabled selected>Choose an item</option>
                    <option value="wand">Wand</option>
                     <option value="headless">headless</option>
                     <option value="crown">crown</option>
                     <option value="bow">bow</option>
                    
                    </select>
                    <button>Create Character</button>
           </form>
            </div>
        </body>
<html>
