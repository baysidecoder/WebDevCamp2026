<html>
    <head>
        <title> Guess the number</title>
        <link rel="stylesheet" href="style.css">
        
    </head>
        <body>
            <div>
                <h1 class="lable"> Guess the number</h1>
                <p>Pick a number 1 to 100</p>
                <input id="guess" type="number" min="1" max="100">
                <button id="Check"> Check Guess</button>
                <p class="score"> Score:<strong id="Score">0</strong></p>
                <p class="Highscore">Highscore <strong id="Highscore">0</strong></p>
                <P id="result"> Make your first guess</P>
                <img src="https://ecdn.teacherspayteachers.com/cdn-cgi/image/format=avif,quality=70,width=525,height=525,onerror=redirect/thumbitem/Hundred-Chart-8890954-1675452002/750f-8890954-1.jpg">
            </div>
            <script src="Script.js"></script>
        </body>
</html>
