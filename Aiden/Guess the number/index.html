<html>
    <head>
        <title>Guess the number</title>
        <link rel="stylesheet" href="style.css">
        
    </head>
    <body>
        <div>
            <h1 class="label">GUESS THE NUMBER!</h1>
            <p>pick a number from 1 to 100</p>
            <input id="guess" type="number" min="1" max
                ="100">
            <button id="chec">Check Guess</button>
            <p class="score" > Score: <strong id= "score">0
                </strong> </p>
            <p id="result">Make your first guess</p>
        </div>
        <script src="script.js"></script>
    </body>
</html>
