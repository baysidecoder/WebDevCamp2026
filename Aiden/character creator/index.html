<html>
    <head>
        <title>Character Creator</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="creatorCard">
            <h1>Character Creator</h1>
            <p class="intro">Create a normal avarage over simplified easy cakewalk guy!</p>
            <form>
                <label for="name">Character Name</label>
                <input id="name" type="text" placeholder="Example: Jerome, Dequavious, The Third" required>
                <label for="class">jim bob's class</label>
                <select id="class" required>
                    <option value="" disabled selected>Choose a jim bob</option>
                    <option value="sigma">Sigma</option>
                     <option value="sigma">rizzler</option>
                      <option value="sigma">the ultimate jim bob</option>
                </select>
                <label for ="favorite-color">Favourite Colour</label>
                <input id="color" type="color" value="white">
                
                <label for="startingItem"> Starting Item </label>
                <select id="item" >
                    <option value="" disabled selected>Choose an item</option>
                    <option value="almond water">almond water</option>
                    <option value="amulet of skibidi">amulet of skibidi</option>
                </select>
                <button>Create Character</button>
            </form>
        </div>
    </body>
</html>
