<html>
    <head>
        <title>Guess The Number</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div>
            <h1 class="label">GUESS THE NUMBER</h1>
            <p>Pick a number from 1 to 100</p>
            <input id="guess" type="number" min="1" max="100">
            <button id="check">Check Guess</button>
            <p class="score" > Score: <strong id="score">0</strong> </p>
            <p class="highscore">Highscore: <strong id="highscore">0</strong></p>
            <button id="reset">Reset Game</button>
            <p id="result">Make your first guess</p>
        </div>
        <script src="script.js"></script>

    </body>
</html>
